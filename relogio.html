  <h1 class="h1-relogio">Relógio Mundial</h1>

  <div class="clocks">
    <div class="clock-card">
      <span class="card-label">Digital</span>
      <div class="digital" id="dig-time">00:00:00</div>
      <div class="date-str" id="dig-date">—</div>
    </div>
    <div class="clock-card">
      <span class="card-label">Analógico</span>
      <canvas id="analog" width="170" height="170"></canvas>
    </div>
  </div>

  <div class="tz-section">
    <div class="tz-section-label">Selecione o fuso horário por país:</div>
    <div class="tz-grid" id="tz-grid"></div>
    <div class="selected-info" id="sel-label">Brasília — Brasil (UTC-3)</div>
  </div>
